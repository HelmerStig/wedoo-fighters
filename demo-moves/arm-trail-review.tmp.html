<!doctype html><html lang="it"><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>body{padding:25px;max-width:850px;margin:auto}.animation-gallery{grid-template-columns:1fr}.stage canvas{width:512px!important;max-width:100%}#result{font:13px system-ui;color:white;margin:10px}</style><script src="catalog.js"></script><script src="player-core.js"></script><script src="arm-trail.js"></script><script src="animation-gallery.js"></script><h1>Oscar · prova particelle</h1><p id="result">Caricamento</p><div id="gallery"></div><script>
const source=MOVES_CATALOG.characters.find(c=>c.id==='oscar');const a=source.animations.find(a=>a.id==='medium-punch');const g=MovesGallery.install(document.getElementById('gallery'),{...source,animations:[a]});g.pauseAll();
const poll=setInterval(()=>{
const timeline=document.querySelector('[data-role=timeline]');if(timeline.disabled)return;clearInterval(poll);
timeline.value=32;timeline.dispatchEvent(new Event('input'));
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),toggle=document.querySelector('[data-role=arm-trail]'),range=document.querySelector('[data-role=arm-trail-strength]');
const on=ctx.getImageData(0,0,512,512).data;
toggle.checked=false;toggle.dispatchEvent(new Event('change'));const off=ctx.getImageData(0,0,512,512).data;
let diff=0,outside=0,x0=512,y0=512,x1=0,y1=0;
for(let i=0;i<on.length;i+=4){if(on[i]===off[i]&&on[i+1]===off[i+1]&&on[i+2]===off[i+2]&&on[i+3]===off[i+3])continue;diff++;const x=i/4%512,y=Math.floor(i/4/512);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);if(x<230||x>455||y<95||y>205)outside++;}
toggle.checked=true;toggle.dispatchEvent(new Event('change'));range.value=0;range.dispatchEvent(new Event('input'));const zero=ctx.getImageData(0,0,512,512).data;let zeroDiff=0;for(let i=0;i<zero.length;i++)if(zero[i]!==off[i])zeroDiff++;
range.value=75;range.dispatchEvent(new Event('input'));document.body.dataset.qa=diff>100&&outside===0&&zeroDiff===0?'pass':'fail';document.getElementById('result').textContent=JSON.stringify({changedPixels:diff,bbox:[x0,y0,x1,y1],outsideArmZone:outside,zeroIntensityDiff:zeroDiff});
},30);
</script></html>
